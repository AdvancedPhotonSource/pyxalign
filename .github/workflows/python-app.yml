# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development" ]
  workflow_dispatch:

env:
  CUDA_VISIBLE_DEVICES: 1

permissions:
  contents: read

jobs:
  pre_check:
    # Skips the expensive build/test job when this exact code already passed
    # in another run - e.g. a push to development followed by a fast-forward
    # PR into master, or a push to a branch with an already-open PR, which
    # fires both a push run and a pull_request(synchronize) run for the same
    # commit at nearly the same time (concurrent_skipping handles this case;
    # skip_after_successful_duplicate alone only catches already-finished runs)
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          skip_after_successful_duplicate: 'true'
          concurrent_skipping: 'same_content_newer'

  build:
    needs: pre_check
    if: needs.pre_check.outputs.should_skip != 'true'

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: setup
        run: |
          source ~/.bashrc
          echo "PYXALIGN_CI_TEST_DATA_DIR=$PYXALIGN_CI_TEST_DATA_DIR" >> $GITHUB_ENV
          echo "CONTAINERS_CONF=/local/containers.conf" >> $GITHUB_ENV

      - name: build container
        run: podman build -f docker/Dockerfile.cuda13 -t localhost/pyxalign-actions-runner-image .

      - name: start container and run pytest
        run: |
          echo  $PYXALIGN_CI_TEST_DATA_DIR
          podman run --rm --env DISPLAY \
            --security-opt label=type:container_runtime_t --network host \
            --device nvidia.com/gpu=all \
            -v="$HOME/.Xauthority:/root/.Xauthority:rw" \
            --env PYXALIGN_CI_TEST_DATA_DIR=$PYXALIGN_CI_TEST_DATA_DIR \
            -v=$PYXALIGN_CI_TEST_DATA_DIR:$PYXALIGN_CI_TEST_DATA_DIR \
            pyxalign-actions-runner-image:latest bash -c \
            "pip install pytest && cd pyxalign && pytest -s"

      - name: container cleanup
        run: |
          podman rmi pyxalign-actions-runner-image